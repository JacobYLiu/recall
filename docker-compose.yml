services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    env_file: .env
    command: >
      sh -c "pip install -e . && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  # Build with: docker compose --profile sandbox build sandbox
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    profiles: ["sandbox"]
